[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litdown"
version = "0.3.0"
description = "Convert scholarly full-text XML (JATS, Elsevier) to Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Toby Sargeant" }]
keywords = ["jats", "elsevier", "pmc", "markdown", "mathml", "latex"]
dependencies = ["defusedxml>=0.7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Repository = "https://github.com/populationgenomics/litdown"
Issues = "https://github.com/populationgenomics/litdown/issues"

[project.scripts]
litdown = "litdown.__main__:main"

# Supply-chain age gate: never resolve a release younger than 7 days. Declared
# in-repo (not only in global uv config) so CI and contributors inherit the same
# resolution. Relative, not a fixed date: an ongoing "nothing younger than 7
# days", not a frozen cutoff.
[tool.uv]
exclude-newer = "7 days"

# Dev tooling (PEP 735 groups): not shipped, so it lives here rather than in
# project.optional-dependencies. pyright checks litdown/ + tests/, so the lint
# group carries pytest for the test imports to resolve. pre-commit is in the
# lint group because CI runs the whole static-check gate via `uv run
# pre-commit run --all-files`. grading: only tools/grade_mml.py (Gemini-based
# MathML grading harness) needs google-genai.
[dependency-groups]
test = ["pytest"]
lint = ["ruff", "pyright", "pytest", "pre-commit"]
grading = ["google-genai"]

[tool.setuptools.packages.find]
include = ["litdown*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
litdown = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "W",
    "ANN", "ARG", "BLE", "COM", "DTZ", "ERA", "EXE", "ICN", "ISC",
    "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE", "RUF",
    "SIM", "SLF", "T10", "TID", "UP", "YTT",
]

fixable = ["ALL"]

ignore = [
    "COM812",  # trailing comma conflicts with the formatter
    # D1xx — docstring *presence*. Format (D2/D3/D4) is enforced when a
    # docstring exists, but one isn't required on every public symbol.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "ERA001",  # false-positives on the dict-section-header comments in the MathML tables
    "ISC001",  # implicit-string-concat conflicts with the formatter
    "PLR0913", # too many arguments in function definition
    "PLR2004", # magic value used in comparison
    "Q000",    # single quotes found but double quotes preferred
    "Q003",    # change outer quotes (conflicts with single-quote formatter)
    # Ambiguous-unicode: the MathML lookup tables carry Greek letters and math
    # operators by design; these fire on every entry.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # asserts are the standard pytest idiom
    "SLF001", # tests legitimately reach into module privates
    "PT009",  # test_mml_unit.py uses unittest.TestCase asserts by design
    "PT018",  # multi-part asserts are fine in tests
    "ANN",    # type annotations not required on tests
    "S603",   # tests shell out to the reference converters by design
    "S607",   # ...invoking them by name (node/npx) rather than absolute path
    "BLE001", # golden-regeneration helpers are best-effort: log and continue
]
"tools/**" = [
    # tools/ holds ad-hoc dev scripts, excluded from the wheel and the type
    # gate; hold them to correctness rules but not library-grade rigor.
    "S101",
    "S310",   # urlopen: fetch scripts pull PMC/W3C fixtures over https
    "S311",   # non-crypto rng: sampling in the grading/compare harnesses
    "S603",
    "S607",
    "BLE001", # best-effort batch scripts: one bad input shouldn't abort the run
    "PLW1510", # subprocess.run without check= is intentional in the render probes
    "ANN",
    "D",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "T201",   # print is the script UI
]
"litdown/elsevier.py" = [
    # Module-private free helpers cooperate with the module-private _Renderer,
    # accessing its _-prefixed methods; not external private access.
    "SLF001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# Complexity thresholds: roughly double the ruff defaults so the checks fire on
# genuinely sprawling code but not on everyday parsers and dispatchers.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 20
max-returns = 10
max-statements = 80
max-locals = 25

[tool.pyright]
pythonVersion = "3.10"
include = ["litdown", "tests"]
typeCheckingMode = "standard"

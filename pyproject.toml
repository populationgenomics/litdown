[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litdown"
version = "0.3.0"
description = "Convert scholarly full-text XML (JATS, Elsevier) to Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Toby Sargeant" }]
keywords = ["jats", "elsevier", "pmc", "markdown", "mathml", "latex"]
dependencies = ["defusedxml>=0.7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Repository = "https://github.com/populationgenomics/litdown"
Issues = "https://github.com/populationgenomics/litdown/issues"

[project.scripts]
litdown = "litdown.__main__:main"

# Supply-chain age gate: never resolve a release younger than 7 days. Declared
# in-repo (not only in global uv config) so CI and contributors inherit the same
# resolution. Relative, not a fixed date: an ongoing "nothing younger than 7
# days", not a frozen cutoff.
[tool.uv]
exclude-newer = "7 days"

# Dev tooling (PEP 735 groups): not shipped, so it lives here rather than in
# project.optional-dependencies. pyright checks litdown/ + tests/, so the lint
# group carries pytest for the test imports to resolve. grading: only
# tools/grade_mml.py (Gemini-based MathML grading harness) needs google-genai.
[dependency-groups]
test = ["pytest"]
lint = ["ruff", "pyright", "pytest"]
grading = ["google-genai"]

[tool.setuptools.packages.find]
include = ["litdown*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
litdown = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ARG",  # unused arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "COM",  # trailing commas
    "DTZ",  # datetime
    "E",    # pycodestyle errors
    "ERA",  # commented-out code
    "EXE",  # executable shebangs
    "F",    # pyflakes
    "G",    # logging-format
    "I",    # isort
    "ICN",  # import conventions
    "ISC",  # implicit string concat
    "N",    # naming
    "PGH",  # pygrep
    "PIE",  # misc
    "PT",   # pytest
    "Q",    # quotes
    "RET",  # returns
    "RSE",  # raise
    "RUF",  # ruff-specific
    "SIM",  # simplify
    "TID",  # tidy imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "YTT",  # year 2k+
]

ignore = [
    "COM812", # trailing-comma conflicts with the formatter
    "ERA001", # commented-out code — false-positives on dict-section headers
    "ISC001", # implicit-string-concat conflicts with the formatter
    "G004",   # logging statement uses f-string
    "PT018",  # multi-part assert
    "PT009",  # use of TestCase.assertEqual — test_mml_unit.py uses unittest legitimately
    "Q000",   # single quotes found but double quotes preferred
    "RUF001", # ambiguous-unicode (Greek letters & operators in MathML lookup tables)
    "RUF002", # ambiguous-unicode in docstrings
    "RUF003", # ambiguous-unicode in comments
    "S101",   # use of assert
]

[tool.mypy]
files = ["litdown", "tests"]
strict_optional = true
check_untyped_defs = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# Type checking runs in CI (pyright). Skipped from pre-commit because
# pyright is slower than is comfortable for a per-commit hook.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: '\.*conda/.*'
      - id: end-of-file-fixer
        # Vendored Elsevier fixtures are verbatim API responses — don't mangle.
        exclude: '^tests/fixtures/elsevier/.*\.xml$'
      - id: trailing-whitespace
        exclude: '\.txt$|\.tsv$|^tests/fixtures/elsevier/.*\.xml$'
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-added-large-files

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/populationgenomics/pre-commits
    rev: v0.1.3
    hooks:
      - id: cpg-id-checker

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff
      - id: ruff-format

  # YAML formatter (ruff can't format YAML).
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
